name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: ${{ matrix.database == 'postgresql' && 'postgres:16-alpine' || '' }}
        env:
          # Kredensial khusus container sementara milik job ini.
          POSTGRES_USER: coffee_manic
          POSTGRES_PASSWORD: coffee_manic_ci
          POSTGRES_DB: coffee_manic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee_manic -d coffee_manic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_ENV: testing
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://coffee_manic:coffee_manic_ci@localhost:5432/coffee_manic_test' || 'sqlite:///:memory:' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Test backend
        run: python -m pytest -q

      - name: Check migrations
        env:
          # SQLite memakai file sementara agar dua perintah melihat database sama.
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://coffee_manic:coffee_manic_ci@localhost:5432/coffee_manic_test' || format('sqlite:///{0}/coffee_manic_migrations.db', runner.temp) }}
        run: |
          python -m flask --app run db upgrade
          python -m flask --app run db current
