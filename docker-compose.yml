services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee-manic-web
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FLASK_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coffee_manic}:${POSTGRES_PASSWORD:-coffee_manic}@db:5432/${POSTGRES_DB:-coffee_manic}
      SECRET_KEY: ${SECRET_KEY:-coffee-manic-secret-key-docker-local-2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-coffee-manic-jwt-secret-key-32-chars-long-local}
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: coffee-manic-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coffee_manic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffee_manic}
      POSTGRES_DB: ${POSTGRES_DB:-coffee_manic}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coffee_manic}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
